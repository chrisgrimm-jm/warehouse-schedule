<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Warehouse Games — Schedule Control</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #080808;
    --panel: #131313;
    --red: #e63946;
    --gold: #ffd166;
    --text: #f2f2f2;
    --sub: #8a8a8a;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    padding: 32px;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 2px;
    font-size: 42px;
    color: var(--red);
    margin: 0 0 4px;
  }
  .sub { color: var(--sub); margin-bottom: 24px; font-size: 13px; }
  .sub b { color: var(--gold); }
  #status { display: inline-block; margin-left: 10px; font-size: 12px; }
  #status.ok::before { content: "●"; color: #4caf50; margin-right: 4px; }
  #status.bad::before { content: "●"; color: var(--red); margin-right: 4px; }

  .panel {
    background: var(--panel);
    border: 1px solid #222;
    border-radius: 8px;
    padding: 20px;
    margin-bottom: 20px;
  }
  .panel h2 {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 1px;
    font-size: 22px;
    margin: 0 0 14px;
    color: var(--text);
  }
  label.field { display: block; font-size: 11px; color: var(--sub); letter-spacing: 1px; margin-bottom: 4px; text-transform: uppercase; }
  input, select {
    background: #1c1c1c;
    border: 1px solid #333;
    color: var(--text);
    font-family: 'DM Mono', monospace;
    padding: 9px 10px;
    border-radius: 5px;
    font-size: 14px;
    width: 100%;
  }
  input:focus, select:focus { outline: none; border-color: var(--red); }
  .time-picker { display: flex; gap: 4px; }
  .time-picker select { width: auto; flex: 1; min-width: 0; padding: 9px 4px; text-align: center; }

  .add-grid {
    display: grid;
    grid-template-columns: 90px 1fr 1fr;
    gap: 14px;
    margin-bottom: 14px;
  }
  .add-grid.times { grid-template-columns: 1fr 1fr 1fr; }

  .add-btn {
    background: var(--red);
    color: white;
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 1px;
    font-size: 18px;
    padding: 10px 24px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
  }

  .game-card {
    display: grid;
    grid-template-columns: 70px 1fr 1fr 32px;
    gap: 16px;
    align-items: start;
    padding: 16px 0;
    border-bottom: 1px solid #222;
  }
  .game-card:last-child { border-bottom: none; }
  .game-badge {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 26px;
    color: var(--gold);
    text-align: center;
  }
  .game-badge span { display: block; font-size: 10px; color: var(--sub); letter-spacing: 1px; }
  .section-card {
    display: grid;
    grid-template-columns: 1fr 200px 32px;
    gap: 16px;
    align-items: center;
    padding: 16px 0;
    border-bottom: 1px solid #222;
  }
  .section-card:last-child { border-bottom: none; }
  .section-card .section-label {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 22px;
    letter-spacing: 1px;
    color: var(--gold);
  }
  .del-btn {
    background: #2a2a2a;
    color: var(--sub);
    font-size: 18px;
    width: 32px;
    height: 32px;
    border: none;
    border-radius: 5px;
    cursor: pointer;
    align-self: center;
  }
  .del-btn:hover { background: var(--red); color: white; }
  .empty { color: var(--sub); font-style: italic; padding: 10px 0; }
  .display-link { color: var(--gold); text-decoration: none; font-size: 13px; }
  .display-link:hover { text-decoration: underline; }
</style>
</head>
<body>

<h1>WAREHOUSE GAMES <span style="color:var(--text)">— SCHEDULE CONTROL</span><span id="status" class="bad">connecting</span></h1>
<div class="sub">Topic: <b id="topicLabel"></b> — changes push live to every display instantly. &nbsp;
  <a class="display-link" id="displayLink" href="#" target="_blank">Open Display →</a>
</div>

<div class="panel">
  <h2>Add Item</h2>
  <div class="add-grid" style="grid-template-columns:180px 90px 1fr 1fr">
    <div>
      <label class="field">Type</label>
      <select id="newType" onchange="toggleAddFields()">
        <option value="game">Game</option>
        <option value="shorts">Shorts Filming</option>
        <option value="headshots">Headshots</option>
      </select>
    </div>
    <div id="newGameNumWrap">
      <label class="field">Game #</label>
      <select id="newGameNum"><option>1</option><option>2</option><option>3</option><option>4</option></select>
    </div>
    <div id="newAwayWrap">
      <label class="field">Away Team</label>
      <select id="newAway"></select>
    </div>
    <div id="newHomeWrap">
      <label class="field">Home Team</label>
      <select id="newHome"></select>
    </div>
  </div>
  <div id="newGameTimesRow" class="add-grid times">
    <div>
      <label class="field">Tech Crew Places</label>
      <div id="newTechWrap"></div>
    </div>
    <div>
      <label class="field">Player Intros</label>
      <div id="newIntrosWrap"></div>
    </div>
    <div>
      <label class="field">First Pitch</label>
      <div id="newFirstPitchWrap"></div>
    </div>
  </div>
  <div id="newSectionTimeRow" class="add-grid" style="grid-template-columns:1fr;display:none">
    <div>
      <label class="field">Start Time</label>
      <div id="newSectionTimeWrap"></div>
    </div>
  </div>
  <button class="add-btn" onclick="addItem()">+ Add</button>
</div>

<div class="panel">
  <h2>Schedule</h2>
  <div id="list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
const FRANCHISES = [
  "Team Baggage", "Caribe", "Forgotten Rotten", "Macflurry Power",
  "We Got Ice", "Woogas", "Potential Losers", "Hopeful Winners", "TBD"
];

firebase.initializeApp({
  apiKey: "AIzaSyBG2PS2muH4i27HefuLeBnZWW-TZ5dkMCw",
  databaseURL: "https://pinpoint-abf21-default-rtdb.firebaseio.com"
});
const _db = firebase.database();

const params = new URLSearchParams(location.search);
const topic = params.get('topic') || 'default';
const fbKey = t => t.trim().replace(/[.#$\[\]\/\s]+/g, '-');
const ref = _db.ref('warehouse-schedule/' + fbKey(topic) + '/state');

document.getElementById('topicLabel').textContent = topic;
document.getElementById('displayLink').href = 'Schedule_Display.html?topic=' + encodeURIComponent(topic);

_db.ref('.info/connected').on('value', snap => {
  const el = document.getElementById('status');
  if (snap.val() === true) { el.className = 'ok'; el.textContent = 'live'; }
  else { el.className = 'bad'; el.textContent = 'connecting'; }
});

function teamOptions(selectedIndex) {
  return FRANCHISES.map((name, i) => `<option value="${name}" ${i === selectedIndex ? 'selected' : ''}>${name}</option>`).join('');
}
['newAway', 'newHome'].forEach((id, i) => {
  document.getElementById(id).innerHTML = teamOptions(i);
});

function to12(hhmm) {
  if (!hhmm) return { h: 12, m: 0, ap: 'AM' };
  let [h, m] = hhmm.split(':').map(Number);
  const ap = h >= 12 ? 'PM' : 'AM';
  h = h % 12; if (h === 0) h = 12;
  return { h, m, ap };
}
function to24(h, m, ap) {
  h = Number(h); m = Number(m);
  if (ap === 'AM') { if (h === 12) h = 0; } else if (h !== 12) h += 12;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}
function timePickerHTML(id, value, itemId, field) {
  const t = to12(value);
  const hOpts = Array.from({ length: 12 }, (_, i) => i + 1)
    .map(v => `<option value="${v}" ${v === t.h ? 'selected' : ''}>${v}</option>`).join('');
  const mOpts = Array.from({ length: 60 }, (_, i) => i)
    .map(v => `<option value="${v}" ${v === t.m ? 'selected' : ''}>${String(v).padStart(2, '0')}</option>`).join('');
  const apOpts = ['AM', 'PM'].map(v => `<option value="${v}" ${v === t.ap ? 'selected' : ''}>${v}</option>`).join('');
  const dataAttrs = itemId ? ` data-item="${itemId}" data-field="${field}"` : '';
  return `<div class="time-picker" id="${id}"${dataAttrs}>
    <select onchange="onPickerChange(this)">${hOpts}</select>
    <select onchange="onPickerChange(this)">${mOpts}</select>
    <select onchange="onPickerChange(this)">${apOpts}</select>
  </div>`;
}
function readTimePicker(id) {
  const [hSel, mSel, apSel] = document.getElementById(id).querySelectorAll('select');
  return to24(hSel.value, mSel.value, apSel.value);
}
function onPickerChange(selectEl) {
  const container = selectEl.parentElement;
  const itemId = container.dataset.item;
  if (!itemId) return;
  updateField(itemId, container.dataset.field, readTimePicker(container.id));
}

document.getElementById('newTechWrap').innerHTML = timePickerHTML('newTech', '');
document.getElementById('newIntrosWrap').innerHTML = timePickerHTML('newIntros', '');
document.getElementById('newFirstPitchWrap').innerHTML = timePickerHTML('newFirstPitch', '');
document.getElementById('newSectionTimeWrap').innerHTML = timePickerHTML('newSectionTime', '');

const SECTION_LABELS = { shorts: 'Shorts Filming', headshots: 'Headshots' };
const kindOf = i => i.kind || 'game';
const sortKey = i => kindOf(i) === 'game' ? i.firstPitch : i.time;

let items = [];

ref.on('value', snap => {
  const val = snap.val();
  items = val && val.items ? (Array.isArray(val.items) ? val.items : Object.values(val.items)) : [];
  render();
});

function save() {
  items.sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
  ref.set({ items, updatedAt: Date.now() });
}

function toggleAddFields() {
  const isGame = document.getElementById('newType').value === 'game';
  document.getElementById('newGameNumWrap').style.display = isGame ? '' : 'none';
  document.getElementById('newAwayWrap').style.display = isGame ? '' : 'none';
  document.getElementById('newHomeWrap').style.display = isGame ? '' : 'none';
  document.getElementById('newGameTimesRow').style.display = isGame ? '' : 'none';
  document.getElementById('newSectionTimeRow').style.display = isGame ? 'none' : '';
}

function addItem() {
  const type = document.getElementById('newType').value;
  if (type === 'game') {
    items.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      kind: 'game',
      gameNum: document.getElementById('newGameNum').value,
      away: document.getElementById('newAway').value,
      home: document.getElementById('newHome').value,
      tech: readTimePicker('newTech'),
      intros: readTimePicker('newIntros'),
      firstPitch: readTimePicker('newFirstPitch')
    });
  } else {
    items.push({
      id: Date.now() + '-' + Math.random().toString(36).slice(2, 7),
      kind: type,
      time: readTimePicker('newSectionTime')
    });
  }
  save();
}

function updateField(id, field, value) {
  const item = items.find(i => i.id === id);
  if (!item) return;
  item[field] = value;
  save();
}

function removeItem(id) {
  items = items.filter(i => i.id !== id);
  save();
}

function gameCard(i) {
  return `
    <div class="game-card">
      <div class="game-badge">G${i.gameNum}<span>GAME</span></div>
      <div>
        <label class="field">Away</label>
        <select onchange="updateField('${i.id}','away',this.value)">${teamOptions(FRANCHISES.indexOf(i.away))}</select>
      </div>
      <div>
        <label class="field">Home</label>
        <select onchange="updateField('${i.id}','home',this.value)">${teamOptions(FRANCHISES.indexOf(i.home))}</select>
      </div>
      <button class="del-btn" onclick="removeItem('${i.id}')">×</button>
      <div style="grid-column:1/2"></div>
      <div class="add-grid times" style="grid-column:2/4;margin:0">
        <div>
          <label class="field">Tech Crew Places</label>
          ${timePickerHTML('tp_' + i.id + '_tech', i.tech, i.id, 'tech')}
        </div>
        <div>
          <label class="field">Player Intros</label>
          ${timePickerHTML('tp_' + i.id + '_intros', i.intros, i.id, 'intros')}
        </div>
        <div>
          <label class="field">First Pitch</label>
          ${timePickerHTML('tp_' + i.id + '_firstPitch', i.firstPitch, i.id, 'firstPitch')}
        </div>
      </div>
    </div>
  `;
}

function sectionCard(i) {
  return `
    <div class="section-card">
      <div class="section-label">${SECTION_LABELS[i.kind]}</div>
      ${timePickerHTML('tp_' + i.id + '_time', i.time, i.id, 'time')}
      <button class="del-btn" onclick="removeItem('${i.id}')">×</button>
    </div>
  `;
}

function render() {
  const list = document.getElementById('list');
  if (!items.length) {
    list.innerHTML = '<div class="empty">No games scheduled yet.</div>';
    return;
  }
  const sorted = [...items].sort((a, b) => sortKey(a).localeCompare(sortKey(b)));
  list.innerHTML = sorted.map(i => kindOf(i) === 'game' ? gameCard(i) : sectionCard(i)).join('');
}
</script>
</body>
</html>
