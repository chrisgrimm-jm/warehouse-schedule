<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Warehouse Games — Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --panel: #2B283A;
    --red: #e63946;
    --gold: #ffd166;
    --text: #f2f2f2;
    --sub: #a8a5b3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    overflow: hidden;
  }
  #wrap {
    margin: 24px;
    padding: 32px 48px;
    background: var(--panel);
    border-radius: 10px;
  }
  #header {
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: baseline;
    margin: 0 0 32px;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 4px;
    font-size: 52px;
    color: var(--red);
    margin: 0;
    text-align: center;
    grid-column: 2;
  }
  h1 span { color: var(--text); }
  #clock {
    grid-column: 3;
    justify-self: end;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 34px;
    letter-spacing: 1px;
    color: var(--gold);
  }
  #list { display: flex; flex-direction: column; gap: 16px; }
  .card {
    display: grid;
    grid-template-columns: 80px 1fr 360px;
    align-items: center;
    gap: 24px;
    background: var(--panel);
    border-left: 6px solid var(--red);
    border-radius: 6px;
    padding: 18px 28px;
  }
  .card.live { border-left-color: var(--gold); }
  .game-badge {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    color: var(--gold);
    text-align: center;
    line-height: 1;
  }
  .game-badge span { display: block; font-size: 11px; color: var(--sub); letter-spacing: 1px; margin-top: 2px; }

  .matchup { display: flex; align-items: center; gap: 18px; }
  .team { flex: 1; }
  .team .name { font-family: 'Bebas Neue', sans-serif; font-size: 28px; letter-spacing: 0.5px; line-height: 1.1; }
  .team .role { font-size: 11px; color: var(--sub); letter-spacing: 1px; }
  .at { font-family: 'Bebas Neue', sans-serif; font-size: 22px; color: var(--sub); }

  .milestones { display: flex; flex-direction: column; gap: 4px; }
  .ms-row { display: flex; justify-content: space-between; font-size: 14px; color: var(--sub); }
  .ms-row .t { color: var(--text); }
  .ms-row.done { opacity: 0.4; }
  .ms-row.current .lbl { color: var(--gold); font-weight: bold; }
  .ms-row.current .t { color: var(--gold); font-weight: bold; }
  .countdown {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 30px;
    letter-spacing: 1px;
    color: var(--gold);
    margin-top: 4px;
  }
  .card.live .countdown { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  .countdown .lbl { font-size: 13px; color: var(--sub); display: block; letter-spacing: 1px; font-family: 'DM Mono', monospace; }
  .empty { text-align: center; color: var(--sub); font-size: 22px; margin-top: 80px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="header">
    <h1>WAREHOUSE GAMES <span>SCHEDULE</span></h1>
    <div id="clock"></div>
  </div>
  <div id="list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyBG2PS2muH4i27HefuLeBnZWW-TZ5dkMCw",
  databaseURL: "https://pinpoint-abf21-default-rtdb.firebaseio.com"
});
const _db = firebase.database();

const params = new URLSearchParams(location.search);
const topic = params.get('topic') || 'default';
const fbKey = t => t.trim().replace(/[.#$\[\]\/\s]+/g, '-');
const ref = _db.ref('warehouse-schedule/' + fbKey(topic) + '/state');

let items = [];

ref.on('value', snap => {
  const val = snap.val();
  items = val && val.items ? (Array.isArray(val.items) ? val.items : Object.values(val.items)) : [];
  render();
});

function timeToday(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  const d = new Date();
  d.setHours(h, m, 0, 0);
  return d;
}

function fmtTime(hhmm) {
  return timeToday(hhmm).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function fmtCountdown(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

const MILESTONES = [
  { key: 'tech', label: 'TECH CREW PLACES' },
  { key: 'intros', label: 'PLAYER INTROS' },
  { key: 'firstPitch', label: 'FIRST PITCH' },
  { key: 'shorts', label: 'SHORTS FILMING' }
];

function render() {
  const list = document.getElementById('list');
  if (!items.length) {
    list.innerHTML = '<div class="empty">No games scheduled.</div>';
    return;
  }
  const sorted = [...items].sort((a, b) => a.firstPitch.localeCompare(b.firstPitch));
  const now = Date.now();
  list.innerHTML = sorted.map(i => {
    const next = MILESTONES.find(m => timeToday(i[m.key]).getTime() > now);
    const live = !next;
    const msHtml = MILESTONES.map(m => {
      const passed = timeToday(i[m.key]).getTime() <= now;
      const isCurrent = next && m.key === next.key;
      return `<div class="ms-row ${passed ? 'done' : ''} ${isCurrent ? 'current' : ''}">
        <span class="lbl">${m.label}</span><span class="t">${fmtTime(i[m.key])}</span>
      </div>`;
    }).join('');
    const countdownHtml = live
      ? `<span class="lbl">STATUS</span>LIVE NOW`
      : `<span class="lbl">${next.label} IN</span>${fmtCountdown(timeToday(i[next.key]) - now)}`;
    return `
      <div class="card ${live ? 'live' : ''}">
        <div class="game-badge">G${i.gameNum}<span>GAME</span></div>
        <div class="matchup">
          <div class="team"><div class="role">AWAY</div><div class="name">${i.away}</div></div>
          <div class="at">@</div>
          <div class="team"><div class="role">HOME</div><div class="name">${i.home}</div></div>
        </div>
        <div>
          <div class="milestones">${msHtml}</div>
          <div class="countdown">${countdownHtml}</div>
        </div>
      </div>
    `;
  }).join('');
}

function renderClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', second: '2-digit' });
}

setInterval(() => { renderClock(); render(); }, 1000);
renderClock();
</script>
</body>
</html>
