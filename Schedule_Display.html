<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Warehouse Games — Schedule</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #000000;
    --panel: #2B283A;
    --panel-card: #38344a;
    --red: #e63946;
    --gold: #ffd166;
    --text: #f2f2f2;
    --sub: #a8a5b3;
  }
  * { box-sizing: border-box; }
  html, body {
    margin: 0;
    height: 100%;
    background: var(--bg);
    color: var(--text);
    font-family: 'DM Mono', monospace;
    overflow: hidden;
  }
  #wrap {
    box-sizing: border-box;
    max-height: calc(100% - 40px);
    overflow: hidden;
    margin: 20px;
    padding: 24px 56px;
    background: var(--panel);
    border-radius: 14px;
    display: flex;
    flex-direction: column;
  }
  #header {
    flex: 0 0 auto;
    display: grid;
    grid-template-columns: 1fr auto 1fr;
    align-items: baseline;
    margin: 0 0 16px;
  }
  h1 {
    font-family: 'Bebas Neue', sans-serif;
    letter-spacing: 6px;
    font-size: 56px;
    color: var(--red);
    margin: 0;
    text-align: center;
    grid-column: 2;
  }
  h1 span { color: var(--text); }
  #clock {
    grid-column: 3;
    justify-self: end;
    font-family: 'Bebas Neue', sans-serif;
    font-size: 38px;
    letter-spacing: 1px;
    color: var(--gold);
  }
  #list {
    flex: 0 1 auto;
    min-height: 0;
    display: flex;
    flex-direction: column;
    gap: 16px;
    transform-origin: top center;
  }
  .card {
    display: grid;
    grid-template-columns: 130px 1fr 480px;
    align-items: center;
    gap: 36px;
    background: var(--panel-card);
    border-left: 8px solid var(--red);
    border-radius: 10px;
    padding: 22px 44px;
  }
  .card.live { border-left-color: var(--gold); }
  .card.warning { border-left-color: var(--red); }
  .countdown.urgent { color: var(--red); animation: pulse 1s ease-in-out infinite; }
  .game-badge {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 48px;
    color: var(--gold);
    text-align: center;
    line-height: 1;
  }
  .game-badge span { display: block; font-size: 16px; color: var(--sub); letter-spacing: 1px; margin-top: 4px; }

  .matchup { display: flex; align-items: center; gap: 28px; }
  .team { flex: 1; }
  .team .name { font-family: 'Bebas Neue', sans-serif; font-size: 72px; letter-spacing: 0.5px; line-height: 1.1; }
  .team .role { font-size: 20px; color: var(--sub); letter-spacing: 1px; }
  .at { font-family: 'Bebas Neue', sans-serif; font-size: 42px; color: var(--sub); }

  .countdown {
    font-family: 'Bebas Neue', sans-serif;
    font-size: 72px;
    letter-spacing: 1px;
    color: var(--gold);
    text-align: right;
    margin-top: 10px;
  }
  .card.live .countdown { animation: pulse 1.4s ease-in-out infinite; }
  @keyframes pulse { 0%,100% { opacity: 1; } 50% { opacity: 0.55; } }
  .countdown .lbl { font-size: 20px; color: var(--sub); display: block; letter-spacing: 1px; font-family: 'DM Mono', monospace; }
  .countdown.static { color: var(--text); }
  .milestones { display: flex; flex-direction: column; gap: 6px; }
  .ms-row { display: flex; justify-content: space-between; gap: 20px; font-size: 22px; color: var(--sub); }
  .ms-row .t { color: var(--text); }
  .ms-row.current .lbl, .ms-row.current .t { color: var(--gold); }
  .empty { text-align: center; color: var(--sub); font-size: 32px; margin-top: 80px; }
</style>
</head>
<body>
<div id="wrap">
  <div id="header">
    <h1>WAREHOUSE GAMES <span>SCHEDULE</span></h1>
    <div id="clock"></div>
  </div>
  <div id="list"></div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.5/firebase-database-compat.js"></script>
<script>
firebase.initializeApp({
  apiKey: "AIzaSyBG2PS2muH4i27HefuLeBnZWW-TZ5dkMCw",
  databaseURL: "https://pinpoint-abf21-default-rtdb.firebaseio.com"
});
const _db = firebase.database();

const params = new URLSearchParams(location.search);
const topic = params.get('topic') || 'default';
const fbKey = t => t.trim().replace(/[.#$\[\]\/\s]+/g, '-');
const ref = _db.ref('warehouse-schedule/' + fbKey(topic) + '/state');

let items = [];

ref.on('value', snap => {
  const val = snap.val();
  items = val && val.items ? (Array.isArray(val.items) ? val.items : Object.values(val.items)) : [];
  render();
});

function timeToday(hhmm) {
  const [h, m] = hhmm.split(':').map(Number);
  const d = new Date();
  d.setHours(h, m, 0, 0);
  return d;
}

function fmtTime(hhmm) {
  return timeToday(hhmm).toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit' });
}

function fmtCountdown(ms) {
  const totalSec = Math.max(0, Math.floor(ms / 1000));
  const h = Math.floor(totalSec / 3600);
  const m = Math.floor((totalSec % 3600) / 60);
  const s = totalSec % 60;
  const pad = n => String(n).padStart(2, '0');
  return h > 0 ? `${h}:${pad(m)}:${pad(s)}` : `${m}:${pad(s)}`;
}

const MILESTONES = [
  { key: 'tech', label: 'TECH CREW PLACES' },
  { key: 'firstPitch', label: 'FIRST PITCH' }
];
const SECTION_LABELS = { shorts: 'Shorts Filming', headshots: 'Headshots', lunch: 'Lunch', break: 'Break' };
const sectionLabel = i => i.kind === 'custom' ? i.label : SECTION_LABELS[i.kind];
const kindOf = i => i.kind || 'game';
const WARNING_MS = 5 * 60 * 1000;
const DUAL_MS = 2 * 60 * 1000;

function gameCard(i, now, isNext) {
  const next = MILESTONES.find(m => timeToday(i[m.key]).getTime() > now);
  const live = isNext && !next;
  const msLeft = isNext && next ? timeToday(i[next.key]) - now : Infinity;
  const warning = isNext && !live && msLeft <= WARNING_MS;
  const milestonesHtml = `<div class="milestones">${MILESTONES.filter(m => {
    const passed = timeToday(i[m.key]).getTime() <= now;
    return !isNext || !passed;
  }).map(m => {
    const passed = timeToday(i[m.key]).getTime() <= now;
    const isCurrent = next && m.key === next.key;
    const showCountdown = isNext && warning && !passed && !isCurrent;
    const valueHtml = showCountdown ? fmtCountdown(timeToday(i[m.key]) - now) : fmtTime(i[m.key]);
    return `<div class="ms-row ${isCurrent ? 'current' : ''}">
        <span class="lbl">${m.label}</span><span class="t">${valueHtml}</span>
      </div>`;
  }).join('')}</div>`;
  const dual = isNext && next && next.key === 'tech' && msLeft <= DUAL_MS;
  let rightHtml;
  if (!isNext) {
    rightHtml = milestonesHtml;
  } else if (dual) {
    const fpLeft = timeToday(i.firstPitch) - now;
    rightHtml = `<div>
      <div class="countdown urgent"><span class="lbl">${next.label} IN</span>${fmtCountdown(msLeft)}</div>
      <div class="countdown"><span class="lbl">FIRST PITCH IN</span>${fmtCountdown(fpLeft)}</div>
    </div>`;
  } else {
    const countdownHtml = live
      ? `<span class="lbl">STATUS</span>LIVE NOW`
      : `<span class="lbl">${next.label} IN</span>${fmtCountdown(msLeft)}`;
    rightHtml = `<div>${milestonesHtml}<div class="countdown ${warning ? 'urgent' : ''}">${countdownHtml}</div></div>`;
  }
  return `
    <div class="card ${live ? 'live' : ''} ${warning ? 'warning' : ''}">
      <div class="game-badge">G${i.gameNum}<span>GAME</span></div>
      <div class="matchup">
        <div class="team"><div class="role">AWAY</div><div class="name">${i.away}</div></div>
        <div class="at">@</div>
        <div class="team"><div class="role">HOME</div><div class="name">${i.home}</div></div>
      </div>
      ${rightHtml}
    </div>
  `;
}

function sectionCard(i, now, isNext) {
  const start = timeToday(i.time).getTime();
  const live = isNext && now >= start;
  const msLeft = start - now;
  const warning = isNext && !live && msLeft <= WARNING_MS;
  const countdownHtml = !isNext
    ? `<span class="lbl">STARTS AT</span>${fmtTime(i.time)}`
    : live
      ? `<span class="lbl">STATUS</span>LIVE NOW`
      : `<span class="lbl">STARTS IN</span>${fmtCountdown(msLeft)}`;
  return `
    <div class="card ${live ? 'live' : ''} ${warning ? 'warning' : ''}" style="grid-template-columns:1fr 480px">
      <div class="matchup">
        <div class="team"><div class="name">${sectionLabel(i)}</div></div>
      </div>
      <div class="countdown ${isNext ? (warning ? 'urgent' : '') : 'static'}">${countdownHtml}</div>
    </div>
  `;
}

function fitList() {
  const wrap = document.getElementById('wrap');
  const header = document.getElementById('header');
  const list = document.getElementById('list');
  list.style.transform = 'none';

  const wrapStyle = getComputedStyle(wrap);
  const wrapMarginV = parseFloat(wrapStyle.marginTop) + parseFloat(wrapStyle.marginBottom);
  const maxHeight = document.body.clientHeight - wrapMarginV;
  const wrapPadV = parseFloat(wrapStyle.paddingTop) + parseFloat(wrapStyle.paddingBottom);
  const headerSpace = header.offsetHeight + parseFloat(getComputedStyle(header).marginBottom);
  const availableForList = maxHeight - wrapPadV - headerSpace;

  const factor = list.scrollHeight > availableForList ? availableForList / list.scrollHeight : 1;
  list.style.transform = factor < 1 ? `scale(${factor})` : 'none';
}

function render() {
  const list = document.getElementById('list');
  if (!items.length) {
    list.innerHTML = '<div class="empty">No games scheduled.</div>';
    return;
  }
  const now = Date.now();
  list.innerHTML = items.map((i, idx) => kindOf(i) === 'game' ? gameCard(i, now, idx === 0) : sectionCard(i, now, idx === 0)).join('');
  fitList();
}

function renderClock() {
  document.getElementById('clock').textContent = new Date().toLocaleTimeString(undefined, { hour: 'numeric', minute: '2-digit', second: '2-digit' });
}

setInterval(() => { renderClock(); render(); }, 1000);
renderClock();
</script>
</body>
</html>
